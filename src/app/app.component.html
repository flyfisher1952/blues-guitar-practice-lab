<header class="site-header">
  <a class="brand" href="#" (click)="setTab('session'); $event.preventDefault()">
    <span class="brand-mark">♮</span>
    <span>BLUES GUITAR PRACTICE LAB</span>
  </a>
  <p>Six strings. Strong time. Good tone.</p>
</header>

<nav class="workbench-nav" aria-label="Practice controls">
  <div class="tabs" role="tablist" aria-label="Practice sections">
    @for (tab of tabs; track tab.id) {
      <button type="button" role="tab" [attr.aria-selected]="activeTab() === tab.id" [class.active]="activeTab() === tab.id" (click)="setTab(tab.id)">
        {{ tab.label }}
      </button>
    }
  </div>
  <label class="key-select">
    <span>KEY</span>
    <select [ngModel]="selectedKey()" (ngModelChange)="changeKey($event)" aria-label="Practice key">
      @for (option of keys; track option.label) {
        <option [value]="option.label">{{ option.label }} major</option>
      }
    </select>
  </label>
</nav>

<main>
  @if (activeTab() === 'session') {
    <app-session
      [blocks]="blocks"
      [completed]="completed()"
      [timerText]="timerText()"
      [timerRunning]="timerRunning()"
      [seconds]="seconds()"
      [completedCount]="completedCount()"
      (blockToggled)="toggleBlock($event)"
      (progressReset)="resetProgress()"
      (timerToggled)="toggleTimer()"
      (timerReset)="resetTimer()" />
  }

  @if (activeTab() === 'triads') {
    <app-triad-shapes
      [selectedKey]="selectedKey()"
      [chordMode]="chordMode()"
      [triadShapes]="triadShapes()"
      (chordModeChange)="setChordMode($event)" />
  }

  @if (activeTab() === 'grooves') {
    <app-build-loop
      [selectedKey]="key()"
      [groove]="groove()"
      [grooveStyle]="grooveStyle()"
      [tempo]="tempo()"
      (grooveStyleChange)="setGroove($event)"
      (tempoChange)="changeTempo($event)" />
  }
</main>

<footer><span>BLUES GUITAR PRACTICE LAB</span><span>Built for six strings and a little grit.</span></footer>
